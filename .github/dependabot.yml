version: 2
updates:
  - package-ecosystem: docker
    directory: /ckan
    schedule:
      interval: weekly
    ignore:
      # Only patch-level updates for CKAN (currently 2.10.x). When this
      # branch moves to a new minor version, remove this ignore rule (or
      # bump it) here and add the equivalent rule on the branch for the
      # older minor version.
      - dependency-name: "ckan/ckan-base"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: docker
    directory: /nginx
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /postgresql
    schedule:
      interval: weekly
    ignore:
      # Postgres major upgrades require a manual pg_upgrade/dump-restore
      # migration of the data volume, never just a tag bump. Minor/patch
      # updates stay unrestricted.
      - dependency-name: "postgres"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
